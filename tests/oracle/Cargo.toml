[package]
name = "oracle"
version = "0.1.0"
edition = "2021"
description = "Runs the scenario of tests/anchor.lean on Agave's runtime (through LiteSVM) and prints what the Lean test must print"
license = "MIT"
publish = false

[dependencies]
litesvm = { version = "0.11.0", features = ["precompiles"] }
sha2 = "0.10.9"
solana-account = "3.4.0"
solana-address = "2.9.0"
solana-instruction = "3.5.1"
solana-keypair = "3.1.2"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.1"

# (tests/oracle-next builds the same source with this on, and the library it needs)
[features]
bls = []
