[package]
name = "memory-probe"
version = "0.1.0"
edition = "2021"
description = "Reads and writes around the end of an account's data, so two runtimes can be compared on where a program's memory ends"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "memory_probe"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
