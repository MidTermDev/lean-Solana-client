name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test (C compiler only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make
      - run: make test
      - name: the outputs are static and freestanding
        run: |
          file build/leanc build/leansol
          ! nm build/leanc | grep ' U '
          ./build/leansol --help

  lean-check:
    name: official Lean agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the official Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make
      - run: make lean-check
