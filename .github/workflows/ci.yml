name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build without a C compiler
        run: make CC=/bin/false
      - run: make test
      - name: a Lean program calls the token programs, from the command line
        run: examples/amm.sh | grep -q 'units     4,690 of 200,000'
      - name: a block of mainnet verifies offline
        run: ./build/leansol block --file tests/blocks/mainnet-474319150.block | grep -q '203 signatures, all valid'
      - name: a snapshot written by Agave loads, verifies and answers lookups
        run: |
          ./build/leansol snapshot --file tests/snapshots/snapshot-1200-9r67SHZcBSFAZhBiAw2cgPsB5TsArx9nHqasU2regDhs.tar.zst --accounts build/state --workers 4 | grep -q '= the hash the snapshot is named after'
          ./build/leansol account TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA --accounts build/state | grep -q 'lamports     1141440'
      - name: a signed transaction is applied, from the command line
        run: examples/transaction.sh | grep -q 'fee          5,120 lamports'
      - name: the outputs are static and freestanding
        run: |
          file build/leanc build/leansol
          ./build/leansol --help
      - name: the checked-in compiler matches its source
        run: |
          make verify-seed
          ! nm build/leanc-c | grep ' U '
          CC=clang make -B build/leanc-c
          make verify-seed

  lean-check:
    name: official Lean agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the official Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make
      - run: make lean-check

  oracle:
    name: Agave agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: run the Anchor and transaction scenarios on Agave's runtime and compare with the Lean virtual machine's output
        run: make oracle
